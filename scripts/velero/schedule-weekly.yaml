# Job 2 of 2 — the Sunday retention tier.
#
# This replaces rather than overlaps Sunday's daily run. Kopia deduplicates
# against the weekday backups, so a weekly copy adds only changed chunks.
#
#   kubectl apply -f schedule-weekly.yaml
#
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly
  namespace: velero
spec:
  schedule: "CRON_TZ=UTC 30 3 * * 0"
  useOwnerReferencesInBackup: false
  template:
    # 720h = 30 days -> about four Sunday restore points.
    ttl: 720h0m0s
    includeClusterResources: true
    defaultVolumesToFsBackup: true
    snapshotVolumes: false
    storageLocation: default
    metadata:
      labels:
        tier: weekly
